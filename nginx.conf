user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;

    # Needed for WebSocket proxying
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream app_servers {
        server app1:3000;
        server app2:3000;
        server app3:3000;
    }

    upstream ws_server {
        server ws-server:4001;
    }

    client_max_body_size 100M;

    server {
        listen 80;

        # WebSocket / GraphQL subscriptions: /ws/* → ws-server (port 4001)
        # The trailing slash in proxy_pass strips the /ws prefix:
        #   /ws/graphql → ws-server:/graphql
        location /ws/ {
            proxy_pass http://ws_server/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Keep WebSocket connections alive for long-lived subscriptions
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://app_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /media/ {
            alias /media/;
            autoindex on;
            access_log off;
        }
    }
}
