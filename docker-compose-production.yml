services:
  app1:
    image: paolini/olifogli
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://db:27017/olifogli
      - NEXTAUTH_URL=https://<your server>/api/auth
      - NEXT_PUBLIC_APP_INSTANCE=app1
      - LOG_DIR=/app/logs
      - SHEETGENDATA_DIR=/app/sheetgendata
      - SHEETGENSPOOL_DIR=/app/sheetgenspool
    volumes:
      - ./logs:/app/logs
      - ./spool:/app/spool
      - ./data:/app/data
      - ./sheetgendata:/app/sheetgendata
      - ./sheetgenspool:/app/sheetgenspool
    networks:
      - backend

  app2:
    image: paolini/olifogli
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://db:27017/olifogli
      - NEXTAUTH_URL=https://<your server>/api/auth
      - NEXT_PUBLIC_APP_INSTANCE=app2
      - LOG_DIR=/app/logs
      - SHEETGENDATA_DIR=/app/sheetgendata
      - SHEETGENSPOOL_DIR=/app/sheetgenspool
    volumes:
      - ./logs:/app/logs
      - ./spool:/app/spool
      - ./data:/app/data
      - ./sheetgendata:/app/sheetgendata
      - ./sheetgenspool:/app/sheetgenspool
    networks:
      - backend

  app3:
    image: paolini/olifogli
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://db:27017/olifogli
      - NEXTAUTH_URL=https://<your server>/api/auth
      - NEXT_PUBLIC_APP_INSTANCE=app3
      - LOG_DIR=/app/logs
      - SHEETGENDATA_DIR=/app/sheetgendata
      - SHEETGENSPOOL_DIR=/app/sheetgenspool
    volumes:
      - ./logs:/app/logs
      - ./spool:/app/spool
      - ./data:/app/data
      - ./sheetgendata:/app/sheetgendata
      - ./sheetgenspool:/app/sheetgenspool
    networks:
      - backend

  db:
    image: mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./database:/data/db
    networks:
      - backend
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'db:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - 8000:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./media:/media:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - backend

networks:
  backend:
