scalar Timestamp
scalar ObjectId
scalar JSON
scalar Data

type Setting {
  _id: ObjectId!
  key: String!
  value: String!
  updatedBy: String!
  updatedOn: Timestamp!
}

type Workbook {
  _id: ObjectId
  name: String
  ownerId: ObjectId
  commonData: Data
  sheetsCount: Int
}

type Permission {
  email: String
  userId: ObjectId
  role: String!
}

input PermissionInput {
  email: String
  userId: ObjectId
  role: String!
}

type Sheet {
  _id: ObjectId!
  name: String!
  schema: String!
  permissions: [Permission!]!
  ownerId: ObjectId!
  workbook: Workbook!
  commonData: Data!
  nRows: Int!
  nValidRows: Int!
  updatedAt: Timestamp
  closed: Boolean
  closedBy: String
  closedOn: Timestamp
  locked: Boolean
  lockedBy: String
  lockedOn: Timestamp
}

input SheetInput {
  name: String!
  schema: String!
  permissions: [PermissionInput!]
  workbookId: ObjectId!
  commonData: Data
}

input UpdateSheetInput {
  _id: ObjectId!
  permissions: [PermissionInput!]
  commonData: Data
  locked: Boolean
}

type OlimanagerRowData {
  participantId: String
  error: String
  participantCreatedOn: Timestamp
  resultsUpdatedOn: Timestamp
  result: JSON
}

type Row {
  _id: ObjectId!
  error: String
  createdOn: Timestamp
  createdBy: String
  updatedOn: Timestamp!
  updatedBy: String!
  data: Data!
  olimanager: OlimanagerRowData
}

type User {
  _id: ObjectId!
  uid: Int
  email: String!
  name: String
  isAdmin: Boolean
}

type Config {
  OLIMANAGER_URL: String
}

type ScanMessage {
  status: String!
  message: String!
  timestamp: Timestamp!
}

type ScanJob {
  _id: ObjectId!
  sheetId: ObjectId!
  ownerId: ObjectId!
  timestamp: Timestamp!
  messages: [ScanMessage!]!
}

type ScanResults {
  _id: ObjectId!
  jobId: ObjectId!
  image: String!
  rawData: Data!
}

type ScanSheetJob {
  _id: ObjectId!
  sheetId: ObjectId!
  timestamp: Timestamp!
  filename: String
  status: String!
  message: String!
  createdBy: String!
}

type ReportEntrySheet {
  commonData: Data!
}

type ReportEntry {
  sheetId: ObjectId!
  sheetName: String!
  studentName: String!
  studentSurname: String!
  classYear: String
  classSection: String
  sheet: ReportEntrySheet!
  score: Float!
  rank: Int!
}

type ScoreDistributionItem {
  score: Float!
  count: Int!
}

type DistributionReport {
  schema: String!
  totalStudents: Int!
  scoreDistribution: [ScoreDistributionItem!]!
  mean: Float
  variance: Float
}

type RankingReport {
  schema: String!
  totalStudents: Int!
  ranking: [ReportEntry!]!
}

type ExerciseDistributionItem {
  exercise: String!
  correct: Int!
  wrong: Int!
  empty: Int!
  invalid: Int!
  A: Int!
  B: Int!
  C: Int!
  D: Int!
  E: Int!
}

type ExerciseReport {
  schema: String!
  totalStudents: Int!
  exerciseDistribution: [ExerciseDistributionItem!]!
}

type Query {
  hello: String
  me: User
  users: [User]
  config: Config
  workbooks: [Workbook]
  workbook(workbookId: ObjectId!): Workbook
  sheets(workbookId: ObjectId): [Sheet!]!
  sheet(sheetId: ObjectId!): Sheet
  rows(sheetId: ObjectId!): [Row!]!
  olimanager: String # testing
  appInstance: String # istanza runtime
  sheetsDistributionReport(sheetIds: [ObjectId!]!, schema: String!, commonData: Data): DistributionReport!
  sheetsRankingReport(sheetIds: [ObjectId!]!, schema: String!, commonData: Data, limit: Int): RankingReport!
  sheetsExerciseReport(sheetIds: [ObjectId!]!, schema: String!): ExerciseReport!
  scanJobs(sheetId: ObjectId!, userId: ObjectId): [ScanJob!]!
  scanResults(jobId: ObjectId!): [ScanResults!]!
  scanSheetJobs(sheetId: ObjectId!): [ScanSheetJob!]!
  getSetting(key: String!): Setting
}

type OlimanagerCreateResult {
  success: Boolean!
  error: String
  participantId: String
}

type Mutation {
  updateUserAdmin(userId: ID!, isAdmin: Boolean!): User
  addSheet(name: String!, schema: String!, workbookId: ObjectId!, permissions: [PermissionInput!]): ObjectId
  deleteSheet(_id: ObjectId!): Boolean
  addSheets(sheets: [SheetInput!]!): Boolean
  updateSheets(sheets: [UpdateSheetInput!]!): Boolean
  deleteSheets(ids: [ObjectId!]!): Boolean

  addRow(sheetId: ObjectId!, data: Data!): Row
  patchRow(_id: ObjectId!, updatedOn: Timestamp!, data: Data!): Row
  deleteRow(_id: ObjectId!): ObjectId
  deleteRows(ids: [ObjectId!]!): Int
  deleteAllRows(sheetId: ObjectId!): Int
  addRows(sheetId: ObjectId!, columns: [String!]!, rows: [[String!]!]!): Int
  validateRows(sheetId: ObjectId!): Int
  
  deleteScan(jobId: ObjectId!): Boolean
  requestScanSheetGeneration(sheetId: ObjectId!, selectedRowIds: [ObjectId!]): Boolean

  # New mutation to create a workbook
  addWorkbook(name: String!): Workbook
  # New mutation to delete a workbook when empty
  deleteWorkbook(_id: ObjectId!): ObjectId

  updateWorkbook(
    _id: ObjectId!
    name: String
    commonData: Data
  ): Boolean

  updateSheet(
    _id: ObjectId!
    name: String
    schema: String
    permissions: [PermissionInput!]
    commonData: Data
  ): Boolean

  closeSheet(_id: ObjectId!): Boolean
  openSheet(_id: ObjectId!): Boolean
  lockSheet(_id: ObjectId!): Boolean
  unlockSheet(_id: ObjectId!): Boolean

  olimanagerCreateParticipant(
    rowIds: [ObjectId!]
    sheetIds: [ObjectId!]
    username: String
    password: String!
  ): [OlimanagerCreateResult!]!

  olimanagerBulkUpdateResults(
    rowIds: [ObjectId!]!
    username: String
    password: String!
  ): Boolean!

  updateSetting(key: String!, value: String!): Setting!
}
