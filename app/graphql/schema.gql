type OlimanagerImportSheet {
  sheetId: ObjectId!
  sheetName: String!
  existingRows: Int!
  newRows: Int!
  """Partecipanti da aggiungere (cognome, nome, scuola), solo finché l'importazione non è conclusa."""
  participants: [String!]!
}

type OlimanagerImport {
  job: OlimanagerJob!
  schema: String!
  contestId: Int!
  warnings: [String!]!
  """Partecipanti già collegati a una riga dei fogli, non conteggiati in totalRows."""
  alreadyPresentRows: Int!
  sheets: [OlimanagerImportSheet!]!
}

"""Persona della rubrica: CD e RD di un distretto o referente (RI) di una scuola."""
type OlimanagerContact {
  name: String!
  surname: String!
  email: String
}

"""Foglio Olifogli di un contest dell'edizione, collegato a una scuola o a un distretto."""
type OlimanagerAddressBookSheet {
  _id: ObjectId!
  name: String!
  """Tipo di foglio (es. «Archimede Biennio») o, se sconosciuto, nome del contest."""
  label: String!
  nRows: Int!
  nValidRows: Int!
  closed: Boolean!
  locked: Boolean!
}

type OlimanagerAddressBookSchool {
  """Codice meccanografico, vuoto se assente in Olimanager."""
  code: String!
  name: String!
  city: String!
  """Sigla della provincia."""
  province: String!
  contact: OlimanagerContact
  """Fogli dei contest scolastici dell'edizione con questo codice meccanografico (solo quelli accessibili all'utente)."""
  sheets: [OlimanagerAddressBookSheet!]!
}

type OlimanagerAddressBookDistrict {
  """Id della zona Olimanager; null per le scuole non riconducibili a un distretto."""
  id: Int
  name: String!
  """Coordinatori distrettuali (CD): responsabili principali della zona."""
  coordinators: [OlimanagerContact!]!
  """Altri responsabili di distretto (RD)."""
  admins: [OlimanagerContact!]!
  """Scuole con iscrizione valida all'edizione e relativo referente (RI)."""
  schools: [OlimanagerAddressBookSchool!]!
  """Fogli dei contest distrettuali dell'edizione di questo distretto (solo quelli accessibili all'utente)."""
  sheets: [OlimanagerAddressBookSheet!]!
  """Avvisi sul distretto e sulle sue scuole (CD mancante, referenti senza email, scuole non assegnate)."""
  warnings: [String!]!
}

type OlimanagerAddressBook {
  districts: [OlimanagerAddressBookDistrict!]!
  """Avvisi generali, non legati a un distretto."""
  warnings: [String!]!
}

type OlimanagerVenueSheetsPreview {
  sheets: [OlimanagerVenueSheet!]!
  warnings: [String!]!
}

type Query {
  olimanagerVenueSheetChoices: [OlimanagerSheetOlympiad!]!
  """Olimpiadi ed edizioni di Olimanager, per ogni utente autenticato con lo scope api."""
  olimanagerOlympiads: [OlimanagerSheetOlympiad!]!
  """Rubrica di CD, RD e RI di un'edizione, letta da Olimanager con i permessi dell'utente."""
  olimanagerAddressBook(olympiadId: String!, editionId: String!): OlimanagerAddressBook!
  olifogliWorkerStatus: OlifogliWorkerStatus!
  """Stato dei worker archiomr, uno per tipo (oliscan, olisheet)."""
  omrWorkerStatus: [OmrWorkerStatus!]!
  olimanagerJobs(sheetIds: [ObjectId!]): [OlimanagerJob!]!
  """Numero di lavori Olimanager in attesa, in preparazione o in corso."""
  olimanagerActiveJobs: Int!
  """Solo amministratori: file condivisi con i worker archiomr, raggruppati per lavoro."""
  workerFiles: WorkerFiles!
  """Solo amministratori: eventi del log applicativo di un giorno (default: il più recente)."""
  appLogs(day: String, limit: Int): AppLogs!
  """Solo amministratori: file di un gruppo restituito da workerFiles."""
  workerFileGroupFiles(kind: String!, jobId: ObjectId): [WorkerFile!]!
  olimanagerJobItems(jobId: ObjectId!, after: ObjectId, failedOnly: Boolean, limit: Int): [OlimanagerJobItem!]!
  """Solo amministratori: ultima importazione dei partecipanti nel raccoglitore, con l'anteprima."""
  olimanagerImport(workbookId: ObjectId!): OlimanagerImport

  hello: String
  me: User
  users: [User]
  config: Config
  workbooks: [Workbook!]!
  workbook(workbookId: ObjectId!): Workbook
  sheets(workbookId: ObjectId): [Sheet!]!
  sheet(sheetId: ObjectId!): Sheet
  rows(sheetId: ObjectId!): [Row!]!
  workbookDistributionReport(workbookId: ObjectId!, schema: String, commonData: Data, state: SheetState): [DistributionReport!]!
  workbookExerciseReport(workbookId: ObjectId!, schema: String, commonData: Data, state: SheetState): [ExerciseReport!]!
  workbookRankingReport(workbookId: ObjectId!, schema: String, commonData: Data, state: SheetState, limit: Int, orderBy: String, orderDirection: Int): [RankingReport!]!
  workbookAgeDistributionReport(workbookId: ObjectId!, schema: String, commonData: Data, state: SheetState): [AgeDistributionReport!]!
  workbookTimeDistributionReport(workbookId: ObjectId!, schema: String, commonData: Data, state: SheetState): [TimeDistributionReport!]!
  cursors(sheetId: ObjectId!): [UserCursor!]!
  scanJobs(sheetId: ObjectId!): [ScanJob!]!
  scanResults(jobId: ObjectId!): [ScanResults!]!
  scanSheetJobs(sheetId: ObjectId!): [ScanSheetJob!]!
  getSetting(key: String!): Setting
}

type OlimanagerCreateResult {
  success: Boolean!
  error: String
  participantId: String
  skipped: Boolean
  converted: Boolean
}

type OlimanagerUpdateExtraFieldsResult {
  success: Boolean!
  error: String
  participantId: String
  skipped: Boolean
}

type Mutation {
  prepareOlimanagerVenueSheets(workbookId: ObjectId!, olympiadId: String!, editionId: String!, schema: String!, contestId: Int!): OlimanagerVenueSheetsPreview!
  resumeOlimanagerCheck(jobId: ObjectId!): OlimanagerJob!
  requestOlimanagerResults(rowIds: [ObjectId!], sheetIds: [ObjectId!]): OlimanagerJob!
  requestOlimanagerMatch(rowIds: [ObjectId!], sheetIds: [ObjectId!]): OlimanagerJob!
  requestOlimanagerCheck(rowIds: [ObjectId!], sheetIds: [ObjectId!]): OlimanagerJob!
  """Solo amministratori: accoda la lettura dei partecipanti del contest per i fogli del raccoglitore con lo schema indicato."""
  requestOlimanagerImport(workbookId: ObjectId!, schema: String!, contestId: Int!): OlimanagerJob!
  """Solo amministratori: conferma l'anteprima e accoda la creazione delle righe."""
  confirmOlimanagerImport(jobId: ObjectId!): OlimanagerJob!
  """Solo amministratori: annulla un'importazione in attesa di conferma o di login."""
  cancelOlimanagerImport(jobId: ObjectId!): OlimanagerJob!
  """Solo amministratori: cancella i file indicati."""
  deleteWorkerFiles(files: [WorkerFileInput!]!): WorkerFileDeletion!
  """Solo amministratori: cancella tutti i file di un gruppo; non modifica il database."""
  deleteWorkerFileGroup(kind: String!, jobId: ObjectId): WorkerFileDeletion!

  updateUserRole(userId: ID!, isAdmin: Boolean!, isSupervisor: Boolean!): User
  addSheet(name: String!, schema: String!, workbookId: ObjectId!, permissions: [PermissionInput!]): ObjectId
  deleteSheet(_id: ObjectId!): Boolean
  addSheets(sheets: [SheetInput!]!): Boolean
  updateSheets(sheets: [UpdateSheetInput!]!): Boolean
  deleteSheets(ids: [ObjectId!]!): Boolean

  addRow(sheetId: ObjectId!, data: Data!, tabId: String): Row
  patchRow(_id: ObjectId!, updatedOn: Timestamp!, data: Data!, tabId: String): Row
  deleteRow(_id: ObjectId!): ObjectId
  deleteRows(ids: [ObjectId!]!): Int
  deleteAllRows(sheetId: ObjectId!): Int
  addRows(sheetId: ObjectId!, columns: [String!]!, rows: [[String!]!]!): Int
  validateRows(sheetId: ObjectId!): Int
  
  deleteScan(jobId: ObjectId!): Boolean
  requestScanSheetGeneration(sheetId: ObjectId!, selectedRowIds: [ObjectId!]): Boolean
  """Responsabili del foglio: cancella una generazione di fogli risposte e i suoi file PDF."""
  deleteScanSheetJob(jobId: ObjectId!): Boolean

  # New mutation to create a workbook
  addWorkbook(name: String!): Workbook
  # New mutation to delete a workbook when empty
  deleteWorkbook(_id: ObjectId!): ObjectId

  updateWorkbook(
    _id: ObjectId!
    name: String
    commonData: Data
  ): Boolean

  updateSheet(
    _id: ObjectId!
    name: String
    schema: String
    permissions: [PermissionInput!]
    commonData: Data
  ): Boolean

  "Ricalcola i contatori denormalizzati del foglio dalle righe (solo admin)."
  recountSheet(_id: ObjectId!): Boolean

  closeSheet(_id: ObjectId!): Boolean
  openSheet(_id: ObjectId!): Boolean
  lockSheet(_id: ObjectId!): Boolean
  unlockSheet(_id: ObjectId!): Boolean

  # create new sheets and rows from rows provided in an existing sheet.
  # Obsolete: replaced by prepareOlimanagerVenueSheets, to be removed once it
  # supports all contests.
  createSheets(sheetId: ObjectId!, rowIds: [ObjectId!], dry: Boolean): String!

  olimanagerCreateParticipant(
    rowIds: [ObjectId!]
    sheetIds: [ObjectId!]
  ): [OlimanagerCreateResult!]!

  olimanagerBulkUpdateResults(
    rowIds: [ObjectId!]
    sheetIds: [ObjectId!]
  ): Boolean!

  olimanagerUpdateExtraFields(
    rowIds: [ObjectId!]
    sheetIds: [ObjectId!]
  ): [OlimanagerUpdateExtraFieldsResult!]!

  cryptSheets(sheetIds: [ObjectId!]!, password: String!): Boolean
  decryptSheets(sheetIds: [ObjectId!]!, password: String!): Boolean

  updateSetting(key: String!, value: String!): Setting!

  moveCursor(sheetId: ObjectId!, lineKey: String, fieldName: String, tabId: String!): Boolean
}

type UserCursor {
  email: String!
  lineKey: String
  fieldName: String
  tabId: String!
}

type Subscription {
  olimanagerJobsUpdated: Boolean!
  """Solo amministratori: nuovi eventi del log applicativo, da tutti i processi."""
  appLogAdded: AppLogEntry!
  sheetUpdated(sheetId: ObjectId!): Sheet!
  rowChanged(sheetId: ObjectId!): Row!
  rowsDeleted(sheetId: ObjectId!): [ObjectId!]!
  cursorChanged(sheetId: ObjectId!): UserCursor!
  workbookUpdated(workbookId: ObjectId!): Boolean!
  scanJobUpdated(sheetId: ObjectId!): Boolean!
  scanSheetJobUpdated(sheetId: ObjectId!): Boolean!
}
