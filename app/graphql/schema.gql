scalar Timestamp
scalar ObjectId
scalar JSON
scalar Data

enum SheetState {
  open
  closed_or_locked
  closed_not_locked
  locked
}

"""Evento del log applicativo (docs/deploy.md)."""
type AppLogEntry {
  """ISO 8601, UTC"""
  timestamp: String!
  level: String!
  source: String!
  event: String!
  userId: String
  """Email dell'utente userId, se esiste ancora"""
  userEmail: String
  """Gli altri campi dell'evento"""
  data: JSON!
}

type AppLogs {
  """false se LOG_DIR non è configurata"""
  available: Boolean!
  """Giorni con un file di log, dal più recente"""
  days: [String!]!
  day: String
  """Dal più recente"""
  entries: [AppLogEntry!]!
  """true se il giorno contiene eventi più vecchi di quelli restituiti"""
  truncated: Boolean!
}

"""Directory condivisa con i worker archiomr (docs/omr.md)."""
type WorkerFileArea {
  area: String!
  label: String!
  kind: String!
  available: Boolean!
}

"""File in una directory condivisa con i worker archiomr."""
type WorkerFile {
  area: String!
  path: String!
  """queued, staging, processing, completed, aborted, tmp, data oppure other"""
  folder: String!
  size: Float!
  modifiedAt: Timestamp!
}

"""File di un lavoro di scansione (kind=scan) o di generazione fogli (kind=sheet)."""
type WorkerFileGroup {
  kind: String!
  """null per i file che non appartengono a un lavoro"""
  jobId: ObjectId
  jobExists: Boolean!
  sheetId: ObjectId
  sheetName: String
  """Raccoglitore del foglio (null se il foglio non esiste più)"""
  workbookId: ObjectId
  workbookName: String
  status: String
  timestamp: Timestamp
  fileCount: Int!
  totalSize: Float!
  folders: [String!]!
  lastModified: Timestamp!
}

type WorkerFiles {
  areas: [WorkerFileArea!]!
  groups: [WorkerFileGroup!]!
}

"""File che non è stato possibile cancellare."""
type WorkerFileFailure {
  area: String!
  path: String!
  """permission (cartella non scrivibile dall'applicazione), not_found oppure error"""
  reason: String!
}

type WorkerFileDeletion {
  deleted: Int!
  failed: [WorkerFileFailure!]!
}

input WorkerFileInput {
  area: String!
  path: String!
}

type OlifogliWorkerStatus {
  running: Boolean!
  activeWorkers: Int!
  lastSeenAt: Timestamp
}

"""Istanza attiva di un worker archiomr (collezione omr_workers)."""
type OmrWorkerInstance {
  version: String!
  startedAt: Timestamp
  lastSeenAt: Timestamp!
  """idle oppure busy."""
  state: String!
  jobId: ObjectId
  busySince: Timestamp
  """Occupato da più di 30 minuti: il processo è vivo ma potrebbe essere bloccato."""
  stuck: Boolean!
}

type OmrWorkerStatus {
  """oliscan oppure olisheet."""
  type: String!
  running: Boolean!
  activeWorkers: Int!
  lastSeenAt: Timestamp
  instances: [OmrWorkerInstance!]!
}

