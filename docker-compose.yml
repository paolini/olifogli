services:
  db:
    image: mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
    - PUID=1000
    - PGID=1000
    volumes:
      - ./database:/data/db
    ports:
      - 127.0.0.1:27017:27017
    restart: unless-stopped
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
  redis:
    image: redis:7
    ports:
      - 127.0.0.1:6379:6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Worker OMR di archiomr (vedi docs/omr.md), avviati solo con
  # "docker compose --profile omr up -d". Le directory vengono da .env, le
  # stesse che usa Olifogli. La rete dell'host permette di usare qualunque
  # MongoDB in ascolto su 127.0.0.1:27017, anche fuori da questo Compose.
  oliscan:
    image: harbor.cs.dm.unipi.it/olifogli/oliscan:main
    profiles: [omr]
    network_mode: host
    environment:
      - MONGODB_URI=mongodb://127.0.0.1:27017/olifogli?directConnection=true
      - SPOOL_DIR=/app/spool
      - DATA_DIR=/app/data
    volumes:
      - ${SCANS_SPOOL_DIR:?impostare SCANS_SPOOL_DIR in .env}:/app/spool
      - ${SCANS_DATA_DIR:?impostare SCANS_DATA_DIR in .env}:/app/data
  olisheet:
    image: harbor.cs.dm.unipi.it/olifogli/olisheet:main
    profiles: [omr]
    network_mode: host
    environment:
      - MONGODB_URI=mongodb://127.0.0.1:27017/olifogli?directConnection=true
    volumes:
      - ${SHEETGENSPOOL_DIR:?impostare SHEETGENSPOOL_DIR in .env}:/app/sheetgenspool
      - ${SHEETGENDATA_DIR:?impostare SHEETGENDATA_DIR in .env}:/app/sheetgendata
