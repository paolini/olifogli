name: Docker Image CI

# develop: solo test. staging: immagine :staging e deploy sul server di staging.
# main: immagini :main, :latest e :<versione>, senza deploy. Vedi README.md.
# Ogni immagine ha anche il tag sha-<commit>: main ritagga l'immagine già
# costruita da staging per lo stesso commit invece di ricostruirla.
on:
  push:
    branches:
      - main
      - develop
      - staging

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - name: install node packages
      run: npm ci
    - name: Test
      run: npm test
    - name: Lint
      run: npm run lint
    - name: Audit production dependencies
      run: npm audit --omit=dev

  build:
    runs-on: ubuntu-latest
    environment: docker-publish
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    # A newer push to the same branch supersedes an image still being built.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v7
    - name: Extract version number
      run: echo VERSION=$( node -e 'console.log(require("./package.json").version)' ) >> $GITHUB_ENV
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: paolini/olifogli
        tags: |
          type=ref,event=branch
          type=sha,format=long
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          type=raw,value=${{ env.VERSION }},enable=${{ github.ref == 'refs/heads/main' }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to docker hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    # The image does not depend on the environment (docs/deploy.md): the one
    # staging built from this commit is the one main would build.
    - name: Find an image of the same commit
      id: existing
      if: github.ref == 'refs/heads/main'
      run: |
        if docker buildx imagetools inspect "paolini/olifogli:sha-${GITHUB_SHA}" > /dev/null 2>&1; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Tag the existing image
      if: steps.existing.outputs.found == 'true'
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        args=()
        while read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<< "$TAGS"
        docker buildx imagetools create "${args[@]}" "paolini/olifogli:sha-${GITHUB_SHA}"
    # No build cache: every release changes package*.json (version) and the
    # sources, so little was reused while exporting the cache took minutes.
    - name: Build and push
      id: docker_build
      if: steps.existing.outputs.found != 'true'
      uses: docker/build-push-action@v7
      with:
        push: true
        context: .
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  deploy_staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
    - name: Trigger Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.STAGING_SSH_HOST || secrets.SSH_HOST }}
        username: ${{ secrets.STAGING_SSH_USER || secrets.SSH_USER }}
        key: ${{ secrets.STAGING_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: /root/docker/olifogli/deploy.sh
