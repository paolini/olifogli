name: Docker Image CI

on:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: install node packages
      run: npm ci
    - name: Test
      run: npm test
    - name: Lint
      run: npm run lint
    - name: Audit production dependencies
      run: npm audit --omit=dev
    - name: Extract version number
      run: echo VERSION=$( node -e 'console.log(require("./package.json").version)' ) >> $GITHUB_ENV
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: paolini/olifogli
        tags: |
          type=ref,event=branch
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          type=raw,value=${{ env.VERSION }},enable=${{ github.ref == 'refs/heads/main' }}
    - name: Login to docker hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push
      id: docker_build
      uses: docker/build-push-action@v7
      with:
        push: true
        context: .
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  deploy_staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    steps:
    - name: Trigger Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.STAGING_SSH_HOST || secrets.SSH_HOST }}
        username: ${{ secrets.STAGING_SSH_USER || secrets.SSH_USER }}
        key: ${{ secrets.STAGING_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: /root/docker/olifogli/deploy.sh
